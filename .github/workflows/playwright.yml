name: Playwright Tests

on:
  push:
    branches: [main, master, nirghosh]

  pull_request:
    branches: [main, master]

  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      # Download project code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Install project dependencies
      - name: Install dependencies
        run: npm ci

      # Install only Chromium browser
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Execute only the 10 smoke tests
      - name: Run Playwright smoke tests
        env:
          CI: true
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright test --project=chromium --grep "@smoke" --reporter=html

      # Create ZIP of the latest report
      - name: Create Playwright report ZIP
        if: always()
        run: |
          if [ -d "playwright-report" ]; then
            zip -r playwright-report.zip playwright-report
          else
            mkdir -p playwright-report
            echo "Playwright report was not generated." > playwright-report/report-not-generated.txt
            zip -r playwright-report.zip playwright-report
          fi

      # Save report in GitHub Actions
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # Send ZIP report through Gmail
      - name: Send Playwright report by email
        if: always()
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: 'Playwright GitHub Actions <${{ secrets.MAIL_USERNAME }}>'
          to: ${{ secrets.MAIL_TO }}
          subject: 'Playwright Smoke Test Report - ${{ job.status }}'
          body: |
            Hello,

            Playwright smoke test execution has finished.

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Status: ${{ job.status }}
            Run number: ${{ github.run_number }}

            GitHub Actions URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            The HTML report for the 10 smoke tests is attached.
          attachments: playwright-report.zip
